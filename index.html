<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    <link rel="stylesheet" href="styles/style.css">
    <script src="scripts/script.js" defer></script>
</head>
<body>
    <table>
        
    </table>

    <button class="new-book-btn">New Book</button>
    <dialog class="form-wrapper">
        <form action="" method="post">
            <p>
                <label for="title">Title: </label>
                <input type="text" id="title" name="title" required minlength="10" maxlength="100">
            </p>
            <p>  
                <label for="author">Author: </label>
                <input type="text" id="author" name="author" required minlength="10" maxlength="100">
            </p>
            <p>
                <label for="pages">Pages: </label>
                <input type="number" id="pages" name="pages" required min="50" max="2000">
            </p>
            <p>
                <button type="submit" id="submit">Add Book</button>
                <button id="close-dialog">Close</button>
            </p>
        </form> 
    </dialog>
</body>
</html>
